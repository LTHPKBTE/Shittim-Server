name: Build and Release Shittim Server

# The release number comes from Directory.Build.props, which is also what the server
# assemblies and ShittimControlCenter/package.json carry. Bump it there (and in
# package.json) before releasing - the guard below refuses to ship a version whose tag
# already exists rather than quietly producing a second build under it.
#
# Triggered by pushing a v<version> tag, which is the normal path:
#   bump Directory.Build.props + package.json -> commit -> git tag v<version> -> git push --follow-tags
# The tag has to name the version the tagged commit declares, so the two cannot drift.
# workflow_dispatch does the same build and creates the tag itself, for re-releasing a
# version whose tag never made it to the remote.
#
# The Control Center's own workflow listens on the same tag, so both carry the same
# concurrency group and run one after the other instead of racing to create the release.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # `dotnet test` drives the Control Center's own node suite (ControlCenterUpdaterTests), and src/js/i18n.js imports i18next straight out of node_modules, which test/console.test.js reaches through ui.js. That suite predates the dependency, so it used to pass on a bare checkout; it does not any more. npm install rather than npm ci because .gitignore keeps package-lock.json out of the tree. --ignore-scripts skips electron's ~150 MB binary download, which nothing in those tests launches.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Control Center dependencies
        shell: pwsh
        working-directory: ShittimControlCenter
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run tests
        shell: pwsh
        run: |
          dotnet test .\Shittim-Server.Tests\Shittim-Server.Tests.csproj -c Release --nologo

      - name: Resolve release tag
        id: version
        shell: pwsh
        run: |
          $props = Get-Content .\Directory.Build.props -Raw
          if ($props -notmatch '<Version>([^<]+)</Version>') {
            throw "no <Version> in Directory.Build.props"
          }
          $version = $Matches[1]

          $package = (Get-Content .\ShittimControlCenter\package.json -Raw | ConvertFrom-Json).version
          if ($package -ne $version) {
            throw "Directory.Build.props is $version but ShittimControlCenter/package.json is $package"
          }

          $tag = "v$version"

          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            # Tagging a commit that still carries the previous number is the mistake this catches.
            throw "pushed $env:GITHUB_REF_NAME but this tree declares $tag - tag the commit that carries the version, or bump the version to match the tag"
          }

          # A tag-triggered run always finds its own tag already in place, and so does a manual re-run of a release that failed part-way. Neither is a problem as long as the tag names this commit. Releasing a second, different commit under a tag that is already out there is, so that is what gets refused.
          $tagCommit = "$(git rev-parse --verify --quiet "refs/tags/$tag^{commit}" 2>$null)".Trim()
          if ($tagCommit) {
            $head = "$(git rev-parse HEAD)".Trim()
            if ($tagCommit -ne $head) {
              throw "$tag already points at $tagCommit but this build is from $head - bump Directory.Build.props and ShittimControlCenter/package.json to release a new commit"
            }
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "asset_name=Shittim-Server-$tag.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish server runtime
        shell: pwsh
        run: |
          dotnet publish .\Shittim-Server\Shittim-Server.csproj -c Release -r win-x64 --self-contained true -o .\server-runtime

      - name: Verify published binary version
        shell: pwsh
        run: |
          $exe = Get-Item .\server-runtime\Shittim-Server.exe
          $shipped = $exe.VersionInfo.FileVersion
          $expected = "${{ steps.version.outputs.tag }}".TrimStart('v')
          if (-not $shipped.StartsWith($expected)) {
            throw "published binary reports $shipped, expected $expected"
          }

      - name: Package release archive
        shell: pwsh
        run: |
          $packageDir = ".\release-package"
          $assetName = "${{ steps.version.outputs.asset_name }}"
          if (Test-Path $packageDir) {
            Remove-Item $packageDir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $packageDir | Out-Null

          Copy-Item ".\server-runtime" "$packageDir\server-runtime" -Recurse
          Copy-Item ".\README.md" "$packageDir\README.md"
          Copy-Item ".\Scripts" "$packageDir\Scripts" -Recurse

          Compress-Archive -Path "$packageDir\*" -DestinationPath ".\$assetName" -Force

      - name: Create Git tag
        if: github.ref_type != 'tag'
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          # -c rather than `git config`, which defaults to --local and writes into this checkout's .git/config. That is harmless on a runner, whose checkout is thrown away with the job - but the same lines run by hand in a real clone re-sign every commit made in it afterwards as the bot, because repo config outranks ~/.gitconfig. That happened once here. -c scopes the identity to the one command and leaves the repository's config alone.
          $bot = @('-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com')
          # Re-releasing a version that already failed once finds the tag in place, and the guard above has already established that it names this commit.
          if (-not "$(git rev-parse --verify --quiet "refs/tags/$tag^{commit}" 2>$null)".Trim()) {
            git @bot tag $tag
          }
          git @bot push origin $tag

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: ${{ steps.version.outputs.asset_name }}
          generate_release_notes: true
